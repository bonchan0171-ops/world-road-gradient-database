[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle Errors
    "F",  # Pyflakes
    "I",  # Import Sort
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"

warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true